# ─────────────────────────────────────────────────────────────
# Nginx config for nova.thisisrober.es
# ─────────────────────────────────────────────────────────────
#
# SETUP INSTRUCTIONS:
#
# 1. Copy this file to the server:
#      scp deploy/nginx-nova.conf ubuntu@<SERVER_IP>:/tmp/nova
#
# 2. Move it into nginx sites:
#      sudo mv /tmp/nova /etc/nginx/sites-available/nova
#      sudo ln -sf /etc/nginx/sites-available/nova /etc/nginx/sites-enabled/nova
#
# 3. Test & reload:
#      sudo nginx -t && sudo systemctl reload nginx
#
# 4. Get SSL certificate:
#      sudo certbot --nginx -d nova.thisisrober.es
#
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name nova.thisisrober.es;

    root /home/ubuntu/nova-agent-ui;
    index index.html;

    # SPA routing: try static files first, fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
