# ─────────────────────────────────────────────────────────────
# Nginx snippet to add to the PORTFOLIO server block
# ─────────────────────────────────────────────────────────────
#
# Add this location block INSIDE the existing thisisrober.es server block
# in /etc/nginx/sites-available/thisisrober, BEFORE the location / block.
#
# This enables SPA routing for the nova-agent UI under /projects/nova-agent/.
# Without it, sub-routes like /projects/nova-agent/chat would return the
# portfolio's index.html instead of the nova-agent's.
#
# After editing:
#   sudo nginx -t && sudo systemctl reload nginx
#
# ─────────────────────────────────────────────────────────────

# --- ADD THIS BLOCK inside the thisisrober.es server { } ---

    # Nova Agent sub-project (SPA fallback)
    location /projects/nova-agent/ {
        alias /home/ubuntu/thisisrober/projects/nova-agent/;
        try_files $uri $uri/ /projects/nova-agent/index.html;
    }

# --- END BLOCK ---
