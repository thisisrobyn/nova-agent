[project]
name = "nova-agent"
version = "0.2.0"
description = "Neural Orchestration & Virtual Agent"
requires-python = ">=3.10"

dependencies = [
    "langchain>=1.1.3",
    "langchain-ollama>=0.3.2",
    "langgraph>=1.0.4",
    "langgraph-prebuilt>=1.0.5",
    "langchain-mcp-adapters>=0.1.0",
    "fastmcp>=3.0.2",
    "httpx>=0.28.0",
    "python-dotenv>=1.2.1",
    "streamlit>=1.54.0",
    "pandas>=2.3.3",
    "openpyxl>=3.1.5",
    "tiktoken>=0.5.0",
    "mcp>=1.0",
    "fastapi[standard]>=0.115.0",
    "uvicorn>=0.34.0",
    "python-jose[cryptography]>=3.4.0",
]

[project.scripts]
nova = "agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "tools", "nova_mcp", "ui", "memory", "api"]
