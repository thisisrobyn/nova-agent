name: Deploy UI

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  SERVER_IP: ${{ secrets.SERVER_IP }}
  SERVER_USER: ubuntu
  SUBDOMAIN_DIR: /home/ubuntu/nova-agent-ui

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check skip
        id: check
        run: |
          MSG=$(git log -1 --pretty=%B)
          if echo "$MSG" | grep -q "\[skip ci\]"; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip == 'false'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: astral-sh/setup-uv@v5
        if: steps.check.outputs.skip == 'false'
        with:
          enable-cache: true

      - name: Refresh roadmap snapshot
        if: steps.check.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.ROADMAP_TOKEN }}
        run: uv run python scripts/fetch_roadmap.py --allow-failure

      - name: Install & build UI
        if: steps.check.outputs.skip == 'false'
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Setup SSH
        if: steps.check.outputs.skip == 'false'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts

      - name: Deploy to nova subdomain
        if: steps.check.outputs.skip == 'false'
        run: |
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "mkdir -p $SUBDOMAIN_DIR"
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no" \
            ui/dist/ $SERVER_USER@$SERVER_IP:$SUBDOMAIN_DIR/

      - name: Health check
        if: steps.check.outputs.skip == 'false'
        run: |
          sleep 3
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://nova.robyn.es/ || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "✅ nova.robyn.es is live (HTTP $STATUS)"
          else
            echo "⚠️  nova.robyn.es returned HTTP $STATUS"
          fi
