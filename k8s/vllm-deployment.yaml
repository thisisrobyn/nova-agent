apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: nova
  labels:
    app: vllm
    app.kubernetes.io/part-of: nova-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          args:
            - --model=Qwen/Qwen2.5-7B-Instruct-AWQ
            - --dtype=auto
            - --quantization=awq_marlin
            - --max-model-len=2048
            - --gpu-memory-utilization=0.85
            - --enforce-eager
            - --trust-remote-code
            - --api-key=$(VLLM_API_KEY)
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
            - name: HF_HOME
              value: /data/huggingface
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-api-key
                  key: VLLM_API_KEY
          volumeMounts:
            - name: hf-cache
              mountPath: /data/huggingface
          # First startup downloads the model — can take 10+ minutes
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: hf-cache
      # No nvidia.com/gpu resource requests — on WSL2 with Docker Desktop
      # the default nvidia runtime gives all pods GPU access via /dev/dxg
