apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova-api
  namespace: nova
  labels:
    app: nova-api
    app.kubernetes.io/part-of: nova-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nova-api
  template:
    metadata:
      labels:
        app: nova-api
    spec:
      nodeSelector:
        role: system
      containers:
        - name: nova-api
          image: 821184871640.dkr.ecr.us-east-1.amazonaws.com/nova-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: OPENAI_API_BASE
              value: "http://nova-llm:8000/v1"
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-api-key
                  key: VLLM_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: nova-api
  namespace: nova
  labels:
    app: nova-api
    app.kubernetes.io/part-of: nova-agent
spec:
  selector:
    app: nova-api
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  type: ClusterIP
