# Patch vLLM deployment for EKS GPU nodes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: nova
spec:
  template:
    spec:
      # Tolerate the GPU taint so this pod can schedule on gpu-spot nodes
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      nodeSelector:
        role: gpu
      containers:
        - name: vllm
          resources:
            requests:
              nvidia.com/gpu: "1"
              cpu: "2"
              memory: "8Gi"
            limits:
              nvidia.com/gpu: "1"
              cpu: "4"
              memory: "14Gi"
