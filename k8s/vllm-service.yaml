apiVersion: v1
kind: Service
metadata:
  # Named nova-llm (not "vllm") to avoid Kubernetes injecting VLLM_* env vars
  # that conflict with vLLM's own environment variables (VLLM_PORT, etc.)
  name: nova-llm
  namespace: nova
  labels:
    app: vllm
    app.kubernetes.io/part-of: nova-agent
spec:
  selector:
    app: vllm
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  type: ClusterIP
